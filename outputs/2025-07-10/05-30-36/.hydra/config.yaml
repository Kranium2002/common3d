benchmark: nemo_rec_dmtet_cube_sketch
scene:
  category: apple
  sequence_name: null
method:
  nemo:
    projection_type: orthographic
    lighting:
      ambient_strength: 0.8
      diffuse_strength: 0.2
      specular_strength: 0.0
    train:
      optimizer:
        class_name: torch.optim.Adam
        kwargs:
          lr: 0.0001
          weight_decay: 0.0001
        lr: 2.0e-05
      scheduler:
        class_name: torch.optim.lr_scheduler.MultiStepLR
        kwargs:
          milestones:
          - 400
          - 600
          gamma: 0.2
        epochs_drop:
        - 20
      epochs: 20
      transform:
        class_name: SequentialTransform
        transforms:
        - class_name: RandomCenterZoom3D
          apply_txtr: false
          W: 512
          H: 512
          scale_with_mask: 1.0
          scale_selection: shorter
          scale_min: 0.9
          scale_max: 1.1
          center_rel_shift_xy_min:
          - -0.1
          - -0.1
          center_rel_shift_xy_max:
          - 0.1
          - 0.1
        - class_name: RGB_UInt8ToFloat
    model:
      backbone:
        class_name: DINOv2
        hub_repo: facebookresearch/dinov2
        hub_model: dinov2_vits14
        downsample_rate: 16
        weights: default
        freeze: true
        layers_returned:
        - 0
      head:
        class_name: ResNet
        block_type: bottleneck
        pad_zero: false
        conv_blocks:
          out_dims:
          - 512
          - 512
          - 128
          strides:
          - 1
          - 1
          - 1
          pre_upsampling:
          - 1.0
          - 1.0
          - 2.0
          out_conv1x1:
          - false
          - false
          - true
        fully_connected:
          out_dim: null
        normalize: false
    objects3d:
      class_name: Meshes
      feats_requires_grad: true
      feats_activation: norm_detach
      feat_dim: 128
      feats_objects: false
      feat_clutter: true
      fpaths_meshes: None
      fpaths_meshes_tforms: None
      normalize_scale: true
      gaussian_splat_enabled: false
      gaussian_splat_opacity: 1.0
      geodesic_prob_sigma: 0.0
      pt3d_raster_perspective_correct: false
      gaussian_splat_pts3d_size_rel_to_neighbor_dist: 0.1
      verts_requires_grad: true
      face_blend_type: hard
      face_blend_count: 2
      face_opacity: 1.0
      face_opacity_face_sdf_sigma: 0.005
      face_opacity_face_sdf_gamma: 0.0001
      _target_: od3d.cv.geometry.objects3d.dmtet_x_gaussians.DMTet_x_Gaussians
      objects_count: 1
      verts: []
      faces: []
      init_radius: 0.9
      tet_res: 16
      start_without_sphere: false
      start_from_cube: true
      feat_clutter_requires_param: false
    name: nemo
    class_name: NeMo
    cams_tform4x4_obj_center_init_method: pred_center_from_cams
    cams_tform4x4_obj_center_init_crop: true
    cams_tform4x4_obj_scale_init_method: pred_scale_from_cams
    material:
      roughness: 0.9
      metallic: 0.0
      base_color:
      - 0.8
      - 0.8
      - 0.8
dataset:
  train:
    meta_format: co3d_rgb_mask
    categories: null
    meta_split: train
    sequences_max: 10
    keypoints:
      car:
      - left-rear-mirror
      - right-rear-mirror
      - front-left-wheel
      - front-right-wheel
      - back-left-wheel
      - back-right-wheel
      - front-left-headlight
      - front-right-headlight
      - back-left-headlight
      - back-right-headlight
      apple:
      - top-center
      - bottom-center
    name: co3d
    class_name: CO3D
    modalities:
    - size
    - category
    - cam_intr4x4
    - cam_tform4x4_obj
    - rays_center3d
    - category
    - rgb
    - mask
    - sequence_name_unique
    - sequence
    - mesh
    mesh_type: alpha500
    mesh_feats_type: M_dinov2_frozen_base_T_centerzoom512_R_acc
    mesh_feats_dist_reduce_type: min_avg
    frames_count_max_per_sequence: null
    block_negative_depth: false
    path_raw: ${platform.path_datasets_raw}/CO3D
    path_preprocess: ${platform.path_datasets_preprocess}/CO3D_Matching
    setup:
      enabled: false
      override: false
      remove_previous: false
    extract_meta:
      enabled: true
      override: false
      remove_previous: false
    preprocess:
      sfm:
        enabled: false
        override: false
      mask:
        enabled: true
        override: false
      pcl:
        enabled: false
        override: false
      tform_obj:
        enabled: false
        override: false
      mesh:
        enabled: false
        override: false
      mesh_feats:
        enabled: false
        override: false
      mesh_feats_dist:
        enabled: false
        override: false
    dict_nested_frames_ban:
      car: null
  test:
    meta_format: co3d_rgb_mask
    categories: null
    meta_split: test
    sequences_max: 5
    keypoints:
      car:
      - left-rear-mirror
      - right-rear-mirror
      - front-left-wheel
      - front-right-wheel
      - back-left-wheel
      - back-right-wheel
      - front-left-headlight
      - front-right-headlight
      - back-left-headlight
      - back-right-headlight
      apple:
      - top-center
      - bottom-center
    name: co3d
    class_name: CO3D
    modalities:
    - size
    - category
    - cam_intr4x4
    - cam_tform4x4_obj
    - rays_center3d
    - category
    - rgb
    - mask
    - sequence_name_unique
    - sequence
    - mesh
    mesh_type: alpha500
    mesh_feats_type: M_dinov2_frozen_base_T_centerzoom512_R_acc
    mesh_feats_dist_reduce_type: min_avg
    frames_count_max_per_sequence: null
    block_negative_depth: false
    path_raw: ${platform.path_datasets_raw}/CO3D
    path_preprocess: ${platform.path_datasets_preprocess}/CO3D_Matching
    setup:
      enabled: false
      override: false
      remove_previous: false
    extract_meta:
      enabled: true
      override: false
      remove_previous: false
    preprocess:
      sfm:
        enabled: false
        override: false
      mask:
        enabled: true
        override: false
      pcl:
        enabled: false
        override: false
      tform_obj:
        enabled: false
        override: false
      mesh:
        enabled: false
        override: false
      mesh_feats:
        enabled: false
        override: false
      mesh_feats_dist:
        enabled: false
        override: false
    dict_nested_frames_ban:
      car: null
