logger:
  local_dir: ${platform.path_exps}
  use_wandb: true
  wandb_project_name: dlcv1
method:
  nemo:
    train:
      optimizer:
        class_name: torch.optim.Adam
        kwargs:
          lr: 0.0001
          weight_decay: 0.0001
        lr: 2.0e-05
      scheduler:
        class_name: torch.optim.lr_scheduler.MultiStepLR
        kwargs:
          milestones:
          - 400
          - 600
          gamma: 0.2
        epochs_drop:
        - 20
      epochs: 5
      transform:
        class_name: SequentialTransform
        transforms:
        - class_name: RandomCenterZoom3D
          apply_txtr: false
          W: 512
          H: 512
          scale_with_mask: 1.0
          scale_selection: shorter
          scale_min: 0.9
          scale_max: 1.1
          center_rel_shift_xy_min:
          - -0.1
          - -0.1
          center_rel_shift_xy_max:
          - 0.1
          - 0.1
        - class_name: RGB_UInt8ToFloat
      dataloader:
        num_workers: 4
        batch_size: 12
        pin_memory: true
    model:
      backbone:
        class_name: DINOv2
        hub_repo: facebookresearch/dinov2
        hub_model: dinov2_vits14
        downsample_rate: 16
        weights: default
        freeze: true
        layers_returned:
        - 0
      head:
        class_name: ResNet
        block_type: bottleneck
        pad_zero: false
        conv_blocks:
          out_dims:
          - 512
          - 512
          - 128
          strides:
          - 1
          - 1
          - 1
          pre_upsampling:
          - 1.0
          - 1.0
          - 2.0
          out_conv1x1:
          - false
          - false
          - true
        fully_connected:
          out_dim: null
        normalize: false
    objects3d:
      class_name: Meshes
      feats_requires_grad: true
      feats_activation: norm_detach
      feat_dim: 128
      feats_objects: false
      feat_clutter: true
      fpaths_meshes: None
      fpaths_meshes_tforms: None
      normalize_scale: true
      gaussian_splat_enabled: false
      gaussian_splat_opacity: 1.0
      geodesic_prob_sigma: 0.0
      pt3d_raster_perspective_correct: false
      gaussian_splat_pts3d_size_rel_to_neighbor_dist: 0.1
      verts_requires_grad: true
      face_blend_type: hard
      face_blend_count: 2
      face_opacity: 1.0
      face_opacity_face_sdf_sigma: 0.005
      face_opacity_face_sdf_gamma: 0.0001
      _target_: od3d.cv.geometry.objects3d.flexicubes.Flexicubes
      objects_count: 1
      verts: []
      faces: []
      init_radius: 0.9
      tet_res: 16
      start_without_sphere: true
      start_from_cube: false
      feat_clutter_requires_param: false
    name: nemo
    class_name: NeMo
    cams_tform4x4_obj_center_init_method: pred_center_from_cams
    cams_tform4x4_obj_center_init_crop: true
    cams_tform4x4_obj_scale_init_method: pred_scale_from_cams
    projection_type: orthographic
    lighting:
      ambient_strength: 0.8
      diffuse_strength: 0.2
      specular_strength: 0.0
    material:
      roughness: 0.9
      metallic: 0.0
      base_color:
      - 0.8
      - 0.8
      - 0.8
    test:
      dataloader:
        num_workers: 4
        batch_size: 4
        pin_memory: true
